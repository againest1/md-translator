name: Build release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add "$TARGET"
      - name: Install Linux linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          # Use musl headers for C dependencies, but let Rust select the native
          # linker. Ubuntu's musl-gcc wrapper breaks x86_64 static PIE startup.
          echo 'CC=musl-gcc' >> "$GITHUB_ENV"
      - name: Check version and source
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          cargo fmt --check
          cargo clippy --locked --all-targets --target "$TARGET" -- -D warnings
          sh -n install.sh
      - name: Build
        run: cargo build --locked --release --target "$TARGET"
      - name: Package
        run: |
          mkdir -p package dist
          binary=md-translator
          if [ "$RUNNER_OS" = Windows ]; then binary=md-translator.exe; fi
          cp "target/$TARGET/release/$binary" package/
          cp README.md USAGE.md LICENSE package/
          cp -R examples package/
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$RUNNER_OS" = Linux ]; then
            file "package/$binary"
            if readelf -l "package/$binary" | grep -q INTERP; then
              echo 'Linux release must not require a dynamic loader.' >&2
              exit 1
            fi
          fi
          reported=$("package/$binary" --version)
          printf 'Packaged program: %s\n' "$reported"
          test "$reported" = "md-translator $version"
          if [ "$RUNNER_OS" = Windows ]; then
            cp install.ps1 package/
            pwsh -NoProfile -Command 'Compress-Archive -Path package/* -DestinationPath dist/md-translator-x86_64-pc-windows-msvc.zip'
          else
            cp install.sh package/
            tar -czf "dist/md-translator-$TARGET.tar.gz" -C package md-translator README.md USAGE.md LICENSE install.sh examples
          fi
          python -c 'import hashlib, pathlib; [(p.with_name(p.name + ".sha256").write_bytes((hashlib.sha256(p.read_bytes()).hexdigest() + "  " + p.name + "\n").encode("ascii"))) for p in pathlib.Path("dist").iterdir() if not p.name.endswith(".sha256")]'
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cp install.sh install.ps1 dist/
          cat dist/*.sha256 > dist/SHA256SUMS
          cd dist
          sha256sum -c SHA256SUMS
          cd ..
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Markdown Translator $RELEASE_TAG" --notes-file .github/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
